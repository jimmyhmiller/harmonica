name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25-ea'
          cache: 'maven'

      - name: Install script dependencies
        run: npm install
        working-directory: scripts

      - name: Install oracle parser dependencies (core)
        run: npm install
        working-directory: harmonica-core/src/test/resources

      - name: Install oracle parser dependencies (jackson)
        run: npm install
        working-directory: harmonica-jackson/src/test/resources

      - name: Generate test262 cache
        run: node scripts/generate-test262-cache.js

      - name: Generate curated cache
        run: node scripts/generate-curated-cache.js

      - name: Run tests
        run: mvn clean test -B -DrunTest262=true

      - name: Upload test262 execution results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-results
          path: |
            harmonica-interpreter/target/test262-results.txt
            harmonica-interpreter/target/test262-summary.txt
            harmonica-interpreter/target/test262-snapshot-regressions.txt
          if-no-files-found: ignore
